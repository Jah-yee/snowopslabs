{{- if .Values.ingress.enabled }}
{{- /* ingress.host, which the deploy engine sets from the lab's domain, names
the one host the app is served on; ingress.hosts is the chart's default. */}}
{{- $hosts := .Values.ingress.hosts }}
{{- with .Values.ingress.host }}
{{- $hosts = list (dict "host" . "paths" (index $.Values.ingress.hosts 0).paths) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "go-api.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "go-api.labels" . | nindent 4 }}
  {{- with .Values.ingress.ingressAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ .host | quote }}
        {{- end }}
      secretName: {{ include "go-api.fullname" . }}-tls
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "go-api.fullname" . }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
