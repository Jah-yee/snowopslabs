# Custom values for the external-secrets Helm chart.
# Referenced by platform/secrets/external-secrets/install.sh.
# Keep the controller, webhook, and cert-controller footprints small for k3d.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 192Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

# The ServiceMonitor brings its own external-secrets-metrics Service when
# Prometheus is installed; metrics.service would create it a second time.
serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: prometheus
