# Notify website - ask snowopslabs-web to sync when `stable` moves.
#
# labs.snowops.net publishes its docs, catalog and release notes from `stable`.
# stable.yaml calls this after it moves the branch; a push made with the
# workflow's own token does not start other workflows, so the push trigger
# below covers a maintainer moving `stable` by hand instead.
#
# Needs the WEBSITE_DISPATCH_TOKEN secret: a fine-grained token with
# Contents: read and write on snowopscloud/snowopslabs-web. Without it the job
# passes with a notice and the website catches up on its daily sync.
name: Notify website

on:
  push:
    branches: [stable]
  workflow_call:
    secrets:
      WEBSITE_DISPATCH_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: ask the website to sync stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable

      - name: Dispatch to snowopslabs-web
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: SYNC_SHA="$(git rev-parse HEAD)" sh scripts/notify-website.sh
