# Tag release - tag the release commit a merge to main brings in, then build it.
#
# `make release` opens a pull request whose first commit sets LAB_VERSION to
# X.Y.Z. When it merges, scripts/release-tag.sh tags that commit vX.Y.Z, and
# the Release workflow is called with the tag, because a tag pushed by a
# workflow starts no workflow of its own. See RELEASING.md.
name: Tag release

on:
  push:
    branches: [main]

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: write # push the tag

jobs:
  tag:
    name: tag the release commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and push
        id: tag
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag="$(sh scripts/release-tag.sh "$BEFORE" "$AFTER")"
          if [ -n "$tag" ]; then
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  release:
    name: release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write # create the draft Release and upload artifacts
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.tag.outputs.tag }}
