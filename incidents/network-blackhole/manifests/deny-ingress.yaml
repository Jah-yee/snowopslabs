# Deny-all-ingress policy: selects every pod in the namespace and allows
# no ingress peers — the kube-router netpol controller in k3s enforces it.
#
# It carries the name the Kubernetes documentation gives this policy and no
# label of the lab's, so nothing about it says who applied it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ${TARGET_NAMESPACE}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
