# Applied by inject.sh into the monitoring namespace; the `release:
# prometheus` label is required by kube-prometheus-stack's rule selector,
# and the `labfault` alert label routes it to the pager.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: labfault-missing-secret-key
  labels:
    release: prometheus
    labfault: "true"
spec:
  groups:
    - name: labfault-missing-secret-key
      rules:
        - alert: LabFaultNoReplicasAvailable
          expr: max(kube_deployment_status_replicas_available{namespace="${TARGET_NAMESPACE}", deployment="${TARGET_WORKLOAD}"}) == 0
          for: 1m
          labels:
            labfault: "true"
            severity: critical
          annotations:
            summary: "${TARGET_WORKLOAD} has no available replicas"
            description: "Deployment ${TARGET_NAMESPACE}/${TARGET_WORKLOAD} has had no available replica for a minute: every request to it fails. Find out what state its pods are in."
